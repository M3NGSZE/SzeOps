server {
    listen 80;
    server_name reactjs-devops11.sentry-void.uk; # Your domain name

    location / {
        proxy_pass http://localhost:3000; # Address of your backend application

        # Recommended headers to pass client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
